; Fairberry Writer Deck -- X4 firmware
;
; This is a separate PlatformIO project from freeink-sdk itself, referencing
; it as an external dependency rather than living inside that repo -- per
; freeink-sdk's own quickstart docs, app code is meant to be its own
; PlatformIO workspace with FreeInk's libraries linked in, not code added
; directly to the SDK checkout.
;
; SETUP (do this before building):
;   1. Clone the SDK checkout next to this project (adjust the path below
;      if you put it somewhere else):
;        git clone https://github.com/shelbeeely/freeink-sdk.git ../../freeink-sdk
;   2. lib_deps below uses PlatformIO's standard symlink:// dependency
;      protocol (https://docs.platformio.org/en/latest/librarymanager/ldf.html)
;      to link against that checkout's libs/ directory. I could not get a
;      verbatim copy of freeink-sdk's own quickstart example to confirm
;      this exact path against the SDK's real internal layout -- verify
;      libs/ is actually where FreeInkDisplay/InputManager/BleKeyboardHost/
;      FreeInkUI/etc. live in your checkout, and adjust if not.
;   3. pio run -e xteink_x4 -t upload

[env:xteink_x4]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

lib_deps =
  symlink://../../freeink-sdk/libs
  h2zero/NimBLE-Arduino@^2.3.8

build_flags =
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_CAP_BLE_HID_HOST=1
  ; See Documentation/Hardware_X4_Writer_Deck.md for what else this needs
  ; enabled/verified against the actual SDK checkout.
